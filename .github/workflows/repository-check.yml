name: Repository check

on:
  push:
  pull_request:

# Everything here is cheap: the dataset is generated in memory and the largest
# model trains in seconds, so continuous integration reruns the whole benchmark
# rather than trusting the committed numbers.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.16.1

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Files present, results consistent, README matches
        run: python scripts/check_repository.py

      # Reruns everything into a temporary file rather than over the committed
      # results, so a fourth-decimal difference between platforms cannot rewrite
      # the numbers the README is written from.
      - name: The rerun supports the same conclusions
        run: python scripts/check_reproducibility.py

      - name: The figures still render
        run: python scripts/figures/generate_figures.py

      # scripts/export_summaries.py writes the four files under results/summary and was
      # run by nothing: not the README, not this workflow. They are committed, so a
      # change to the exporter or to benchmark.json could leave them stale with nothing
      # to say so. Regenerating and diffing takes under a second.
      - name: The exported summaries are still the committed ones
        run: |
          python scripts/export_summaries.py
          git diff --exit-code -- results/summary/ || {
            echo "results/summary/ is stale; rerun scripts/export_summaries.py and commit"
            exit 1; }
